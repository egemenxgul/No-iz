services:
  iz_backend:
    build:
      context: ../iz-backend
    container_name: iz_backend
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis

  iz_web:
    build:
      context: ../iz-web
      args:
        - NEXT_PUBLIC_API_URL=https://api.no-iz.app
        - NEXT_PUBLIC_WS_URL=wss://api.no-iz.app/api/ws
    container_name: iz_web
    restart: unless-stopped
    ports:
      - "3000:3000"

  iz_admin:
    build:
      context: ../iz-admin
    container_name: iz_admin
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: iz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iz_user -d iz_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: iz_redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: iz_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  adminer:
    image: adminer
    container_name: iz_adminer
    restart: unless-stopped
    depends_on:
      - postgres

  caddy:
    image: caddy:2-alpine
    container_name: iz_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - iz_backend
      - iz_web
      - iz_admin
      - postgres
      - redis
      - minio

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  default:
    name: iz_network
