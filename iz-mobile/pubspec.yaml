name: iz_mobile
description: "iz — End-to-end encrypted messenger"
publish_to: 'none'
version: 1.0.0+1

environment:
  # Flutter 3.22+ (Dart 3.4) ile iOS 13-27 ve Android 6+ desteklenir.
  # Flutter SDK güncellendikçe bu kısıtlama otomatik kapsanır.
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # ── State Management ─────────────────────────────────────────────────────────
  # Riverpod 2.x: Mevcut kod tabanı Notifier/NotifierProvider 2.x API'si
  # kullanıyor. 3.x'e geçiş breaking change gerektirir — bekletiliyor.
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Networking ────────────────────────────────────────────────────────────────
  dio: ^5.7.0
  web_socket_channel: ^3.0.3
  http_parser: ^4.1.2
  connectivity_plus: ^6.1.1          # WiFi/4G değişimlerinde WS yeniden bağlantı

  # ── Routing ───────────────────────────────────────────────────────────────────
  go_router: ^14.6.2

  # ── Local Storage & Crypto ────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.4
  sqflite_sqlcipher: ^3.4.0          # SQLCipher şifreli SQLite (iOS + Android)
  sqlcipher_flutter_libs: ^0.7.0     # Native SQLCipher binary'leri
  cryptography: ^2.7.0               # X3DH / Double Ratchet için
  encrypt: ^5.0.3                    # AES yardımcı

  # ── UI / Fonts / Design ───────────────────────────────────────────────────────
  google_fonts: ^6.3.0

  # ── Utilities ─────────────────────────────────────────────────────────────────
  uuid: ^4.5.1
  archive: ^3.6.1                    # 4.x breaking — 3.x stable
  path: ^1.9.1
  path_provider: ^2.1.5
  battery_plus: ^6.2.0

  # ── Media ─────────────────────────────────────────────────────────────────────
  file_picker: ^8.1.7
  flutter_image_compress: ^2.3.0

  # ── Google Sign-In ────────────────────────────────────────────────────────────
  # 6.2.x = Dart SDK >=2.17.0 <4.0.0 → Dart 3.4.4 ile uyumlu
  # 7.x Dart ^3.7.0 gerektirir (CI/CD'de 3.4.4 mevcut)
  google_sign_in: ^6.2.2
  googleapis: ^12.0.0
  googleapis_auth: ^1.6.0
  
  # ── Apple Sign-In ─────────────────────────────────────────────────────────────
  sign_in_with_apple: ^6.1.3

  # ── Firebase ──────────────────────────────────────────────────────────────────
  # firebase_core 3.x = Firebase SDK 11 → GoogleDataTransport ~> 10.0
  # Bu sürüm grubu kendi içinde tamamen uyumlu ve iOS 13+ / Android 6+ destekler.
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5

  # ── Push Notifications (Local) ───────────────────────────────────────────────
  # 17.x: flutter_webrtc ile uyumlu. 18.x Android notification permission değişiyor.
  flutter_local_notifications: ^17.2.4

  # ── WebRTC (P2P Sesli/Görüntülü) ─────────────────────────────────────────────
  # 0.11.7: iOS 13+ / Android 6+ / Flutter 3.22 ile test edilmiş kararlı sürüm
  flutter_webrtc: ^0.11.7

  # ── QR / Barcode ─────────────────────────────────────────────────────────────
  # mobile_scanner 6.x → MLKit BarcodeScanning 7.x → GoogleDataTransport ~> 10.0
  # Firebase SDK 11 ile tam uyumlu (5.x'in çakışması giderildi)
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2

  # ── CallKit / ConnectionService ───────────────────────────────────────────
  # iOS'ta kilitli ekranda gelen arama UI (CallKit) + Android ConnectionService
  flutter_callkit_incoming: ^2.2.2
  video_compress: ^3.1.4
  passkeys: ^2.20.0

dev_dependencies:
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true
  generate: true
